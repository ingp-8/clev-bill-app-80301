spring:
  application:
    name: clevbill

  datasource:
    url: jdbc:postgresql://localhost:5432/clevbill_db
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: change-me-in-application-local-yml
    expiration-minutes: 60
